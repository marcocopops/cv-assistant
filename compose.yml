services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
       - "127.0.0.1:5432:5432"
    volumes:
       - ./pgdata:/var/lib/postgresql/data
    mem_limit: 512m

