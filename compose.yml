services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    image: cv-assistant-api
    container_name: cv-api
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      OLLAMA_URL: http://ollama:11434
      ALLOWED_ORIGINS: http://localhost:8081,https://marcantoine-meunier.com
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - llm
      - edge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    # Hardening: this container will be reachable from the internet.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1

networks:
  llm:
    external: true
  edge:
    external: true